<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <form>
<div class="formulário">

    <h1>Cadastro de Usuário</h1>

    <form action="sucesso.html">

        <label>Nome Completo:</label>
        <input type="text" id="name" name="nome" placeholder="Digite seu nome completo" required>

        <label>Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required>

        <label>CPF:</label>
        <input type="text" placeholder="Apenas números(11 dígitos)" maxlength="11" minlength="11" pattern="[0-9]{11}" required>

        <label>Gênero:></label><select required>
            <option value="Selecione..."></option>
            <option value="Feminino"></option>
            <option value="Masculino"></option>
            <option value="Outro">Outro</option>
</select>

       <label>Telefone</label>
       <input type="tel" id="telefone" name="telefone" placeholder="(00)00000-0000"required>

       <label>E-mail:</label>
       <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>

       <label>Cidade:</label>
            <input type="text" id="cidade" name="cidade" required>

            <label>UF (Estado):</label>
            <select required>
                <option value="">Selecione</option>
                <option>AC</option>
                <option>AL</option>
                <option>AP</option>
                <option>AM</option>
                <option>BA</option>
                <option>CE</option>
                <option>DF</option>
                <option>ES</option>
                <option>GO</option>
                <option>MA</option>
                <option>MT</option>
                <option>MS</option>
                <option>MG</option>
                <option>PA</option>
                <option>PB</option>
                <option>PR</option>
                <option>PE</option>
                <option>PI</option>
                <option>RJ</option>
                <option>RN</option>
                <option>RS</option>
                <option>RO</option>
                <option>RR</option>
                <option>SC</option>
                <option>SP</option>
                <option>SE</option>
                <option>TO</option>
            </select>

            <button type="submit">Cadastrar</button>

              <div class="mensagem">

        <h1>O SENAI AGRADECE SUA INSCRIÇÃO!!!</h1>

        <button onclick="window.location.href='index.html'">
            Voltar
        </button>

    </div>
    </form>

</body>
</html>
